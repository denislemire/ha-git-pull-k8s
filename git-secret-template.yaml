---
# Template for creating a secret with SSH key for git authentication
# 
# For SSH authentication:
# 1. Generate an SSH key pair (if you don't have one):
#    ssh-keygen -t ed25519 -f ~/.ssh/git-pull-key -N ""
#
# 2. Add the public key to your git repository (GitHub, GitLab, etc.)
#
# 3. Create the secret:
#    kubectl create secret generic git-pull-ssh-key \
#      --from-file=id_rsa=/path/to/private/key \
#      --from-file=id_ed25519=/path/to/private/key \
#      --from-file=known_hosts=<(ssh-keyscan github.com) \
#      -n homeassistant
#
# 4. Update k8s-git-pull.yaml to mount this secret and configure SSH

---
# Example: Secret for SSH key (create this manually)
# kubectl create secret generic git-pull-ssh-key \
#   --from-file=ssh-privatekey=/path/to/your/private/key \
#   --from-file=known_hosts=<(ssh-keyscan your.git.host) \
#   -n homeassistant

