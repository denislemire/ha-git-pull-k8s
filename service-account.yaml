---
# Service Account for git-pull pod
# This allows the pod to restart Home Assistant deployment
apiVersion: v1
kind: ServiceAccount
metadata:
  name: git-pull
  namespace: homeassistant

---
# Role with permissions to restart Home Assistant
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: git-pull-role
  namespace: homeassistant
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
  resourceNames: ["homeassistant"]
- apiGroups: ["apps"]
  resources: ["deployments/restart"]
  verbs: ["create"]
  resourceNames: ["homeassistant"]

---
# RoleBinding to grant permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: git-pull-rolebinding
  namespace: homeassistant
subjects:
- kind: ServiceAccount
  name: git-pull
  namespace: homeassistant
roleRef:
  kind: Role
  name: git-pull-role
  apiGroup: rbac.authorization.k8s.io

